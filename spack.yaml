spack:
  specs:
  - r@4.5.1
  - python@3.14
  - libiconv
  - ncurses
  - openblas
  - curl
  - openssl
  - pkgconf
  - abseil-cpp
  - zlib
  - zlib-ng+compat
  - cmake
  - gmake
  - git
  - libx11
  - libxml2
  - freetype
  - libjpeg
  - libjpeg-turbo
  - libpng
  - libtiff
  - libwebp +libwebpmux
  - icu4c
  - fontconfig
  - fribidi
  - harfbuzz
  - libgit2
  - cairo
  - readline
  - libuv
  - proj
  - geos
  - gdal
  - udunits
  - r-udunits2
  view: /work/.spack-env/view
  config:
    install_tree:
      root: /work/.spack-env/install
    source_cache: /work/.spack/cache/source
    misc_cache: /work/.spack/cache/misc
    build_stage:
    - /work/.spack/stage
    shared_linking:
      type: rpath
      missing_library_policy: error
  packages:
    gcc:
      externals:
      - spec: gcc@8.5.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
