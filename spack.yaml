# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  specs:
  - r@4.5.1 %gcc@8.5.0
  - cmake %gcc@8.5.0
  - gmake %gcc@8.5.0
  - pkgconf %gcc@8.5.0
  - libxml2
  view: true
  concretizer:
    unify: true
  packages:
    gcc:
      externals:
      - spec: gcc@13.2.0 languages:='c,c++,fortran'
        prefix: /n/sw/helmod-rocky8/apps/Core/gcc/13.2.0-fasrc01
        extra_attributes:
          compilers:
            c: /n/sw/helmod-rocky8/apps/Core/gcc/13.2.0-fasrc01/bin/gcc
            cxx: /n/sw/helmod-rocky8/apps/Core/gcc/13.2.0-fasrc01/bin/g++
            fortran: /n/sw/helmod-rocky8/apps/Core/gcc/13.2.0-fasrc01/bin/gfortran
    llvm:
      externals: []
