spack:
  packages:
    all:
      target: [x86_64_v3]
  specs:
    # Build tools
  - cmake
  - gmake
  - git~nls~man

    # Network / crypto / Git-backed R packages
  - curl
  - openssl
  - libgit2

    # Runtime/system libs
  - libuv
  - libxml2
  - icu4c
  - libx11

    # Graphics/text stack
  - freetype
  - fontconfig
  - harfbuzz
  - fribidi
  - libpng
  - libjpeg-turbo
  - libtiff
  - libwebp

  - r@4.5.1
  - cairo
  view: true

  concretizer:
    unify: true

